name = "ayilon-email"
main = "worker-email.js"
compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding = "USERS_KV"
id = "048553257c414282bc303773aacabf5f"

[[d1_databases]]
binding = "BOT_DB"
database_name = "ayilon-bot"
database_id = "ebd7c041-063f-4fb2-857e-8a98db9603e4"

[vars]
GOOGLE_CLIENT_ID = "1034458772823-ueabquu9735ansahig1vinuqac8qmj4m.apps.googleusercontent.com"
EMAIL_FROM = "AYILON <noreply@ayilon.com>"

[triggers]
crons = ["*/1 * * * *"]

# Custom domain for the API so the edge cache activates (unlimited-free reads).
# Auto-provisioned on deploy IF ayilon.com is a zone in this Cloudflare account
# and the deploy token has DNS edit permission. If not, the deploy fails harmlessly
# (the previously-deployed worker keeps serving) — remove this block to revert.
[[routes]]
pattern = "api.ayilon.com"
custom_domain = true
