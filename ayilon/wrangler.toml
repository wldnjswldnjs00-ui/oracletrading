name = "ayilon-email"
main = "worker-email.js"
compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding = "USERS_KV"
id = "048553257c414282bc303773aacabf5f"

[[d1_databases]]
binding = "BOT_DB"
database_name = "ayilon-bot"
database_id = "ebd7c041-063f-4fb2-857e-8a98db9603e4"

[vars]
GOOGLE_CLIENT_ID = "1034458772823-ueabquu9735ansahig1vinuqac8qmj4m.apps.googleusercontent.com"
EMAIL_FROM = "AYILON <noreply@ayilon.com>"

[triggers]
crons = ["*/1 * * * *"]

# NOTE: api.ayilon.com is attached to this worker as a Custom Domain via the
# Cloudflare dashboard (Workers > Settings > Domains & Routes), NOT here.
# Declaring it as a [[routes]] block re-asserts the zone route on every deploy,
# which fails when the deploy API token lacks zone/route permission. The domain
# binding set in the dashboard persists on its own, so we leave it out here.
