<style>
  :root{--bg:#0a0a0c;--panel:#121216;--panel2:#0e0e12;--line:#22232b;--txt:#f1f2f4;--mut:#8a8b95;--dim:#5d5e69;--accent:#34d39a;--gold:#d8b46a;--bad:#f0616d}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  nav{border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,10,12,.85);backdrop-filter:blur(14px);z-index:5}
  nav .w{display:flex;justify-content:space-between;align-items:center}
  .logo{font-weight:700;letter-spacing:.16em;font-size:16px}.logo i{font-style:normal;color:var(--accent)}
  .w{max-width:680px;margin:0 auto;padding:16px 22px}
  main{padding:40px 0 90px}
  h1{font-size:clamp(26px,4.5vw,38px);font-weight:770;letter-spacing:-.03em;margin-bottom:8px}
  h1 b{color:var(--gold)}
  .lead{color:var(--mut);font-size:15px;margin-bottom:28px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px}
  .card h2{font-size:16px;font-weight:680;margin-bottom:4px}
  .card .sub{color:var(--mut);font-size:13px;margin-bottom:16px}
  .prize-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .prize-row:last-child{border-bottom:none}
  .prize-row .amt{font-weight:750;color:var(--gold);font-variant-numeric:tabular-nums}
  .tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .tag.paid{background:rgba(52,211,154,.14);color:var(--accent)}
  .tag.pending{background:rgba(216,180,106,.14);color:var(--gold)}
  .tag.unclaimed{background:rgba(240,97,109,.12);color:var(--bad)}
  .sec{margin-top:22px}
  .sec-t{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;margin:0 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line)}
  .q{margin-bottom:15px}
  .q label{display:block;font-size:13.5px;font-weight:600;color:var(--txt);margin-bottom:6px}
  .q .req{color:var(--bad);margin-left:2px}
  .q input,.q textarea,.q select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px 13px;font-size:14.5px;font-family:inherit;outline:none;transition:border-color .15s}
  .q textarea{resize:vertical;min-height:74px;line-height:1.55}
  .q input:focus,.q textarea:focus,.q select:focus{border-color:var(--accent)}
  .q.invalid input,.q.invalid textarea,.q.invalid select{border-color:var(--bad)}
  .prof{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-bottom:4px}
  .prof b{color:var(--txt)}
  .wnote{background:rgba(216,180,106,.08);border:1px solid rgba(216,180,106,.32);border-radius:10px;padding:11px 14px;color:var(--gold);font-size:12.5px;line-height:1.55;margin:12px 0}
  .btn{background:var(--accent);color:#06140e;font-weight:700;padding:14px 26px;border-radius:11px;border:none;font-size:15px;font-family:inherit;cursor:pointer;width:100%;transition:opacity .15s}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .msg{border-radius:10px;padding:13px 15px;font-size:14px;margin-top:14px;display:none}
  .msg.ok{display:block;background:rgba(52,211,154,.1);border:1px solid rgba(52,211,154,.35);color:var(--accent)}
  .msg.err{display:block;background:rgba(240,97,109,.1);border:1px solid rgba(240,97,109,.35);color:var(--bad)}
  .done-note{color:var(--accent);font-size:13px;font-weight:600;margin-bottom:12px}
  select#lang{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 9px;font-size:13px;font-family:inherit;cursor:pointer;outline:none}
  .center{text-align:center;padding:40px 0;color:var(--mut)}

let lang=localStorage.getItem('ayilon_lang')||'en';
if(!U[lang]) lang='en';
let DATA=null;

function applyChrome(){
  const u=U[lang];
  document.documentElement.lang=lang;
  document.getElementById('h1').innerHTML=u.title;
  document.getElementById('lead').textContent=u.lead;
  document.getElementById('backLink').textContent=u.back;
  document.getElementById('lang').value=lang;
}
const sel=document.getElementById('lang');
sel.innerHTML=LANGS.map(([v,n])=>`<option value="${v}">${n}</option>`).join('');
sel.addEventListener('change',()=>{lang=sel.value;localStorage.setItem('ayilon_lang',lang);applyChrome();render();});

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function usd(v){return '$'+Number(v||0).toLocaleString(undefined,{maximumFractionDigits:2});}
const boardName=b=>b==='weekly'?({en:'Weekly',ko:'주간',zh:'周赛',es:'Semanal',vi:'Tuần',ru:'Неделя'}[lang]):({en:'Monthly',ko:'월간',zh:'月赛',es:'Mensual',vi:'Tháng',ru:'Месяц'}[lang]);
const metricName=m=>({return:{en:'Return',ko:'수익률',zh:'收益率',es:'Rentab.',vi:'Lợi nhuận',ru:'Доходность'},profit:{en:'Profit',ko:'수익금',zh:'盈利',es:'Beneficio',vi:'Tiền lãi',ru:'Прибыль'},volume:{en:'Volume',ko:'거래량',zh:'交易量',es:'Volumen',vi:'Khối lượng',ru:'Объём'}}[m]||{})[lang]||m;

async function load(){
  if(!token()){ DATA={noauth:true}; render(); return; }
  try{
    const r=await fetch(WORKER_URL+'/arena/my-winnings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionToken:token()})});
    DATA=await r.json();
  }catch(e){ DATA={err:true}; }
  render();
}

function render(){
  const u=U[lang], c=document.getElementById('content');
  if(!DATA){ c.innerHTML='<div class="center">…</div>'; return; }
  if(DATA.noauth){ c.innerHTML=`<div class="card"><p style="color:var(--mut);margin-bottom:16px">${u.loginNeeded}</p><a class="btn" style="display:inline-block;width:auto;text-decoration:none" href="/login.html">${u.loginBtn}</a></div>`; return; }
  if(DATA.err||!DATA.ok){ c.innerHTML=`<div class="card"><p style="color:var(--bad)">${u.err}</p></div>`; return; }
  const wins=DATA.winnings||[];
  if(!wins.length){ c.innerHTML=`<div class="card"><p style="color:var(--mut)">${u.noWins}</p></div>`; return; }

  // Prize list
  let html=`<div class="card"><h2>${u.prizesHdr}</h2><div class="sub" style="margin-bottom:8px"></div>`;
  html+=wins.map(w=>{
    const st=w.paid?`<span class="tag paid">${u.stPaid}</span>`:(w.payout_addr?`<span class="tag pending">${u.stPending}</span>`:`<span class="tag unclaimed">${u.stUnclaimed}</span>`);
    return `<div class="prize-row"><div><b>${boardName(w.board)} · ${metricName(w.metric)} · #${w.rank}</b><div style="color:var(--dim);font-size:12px">${esc(w.season_id)}</div></div><div style="display:flex;align-items:center;gap:12px"><span class="amt">${usd(w.prize)}</span>${st}</div></div>`;
  }).join('');
  html+=`</div>`;

  const unclaimed=wins.filter(w=>!w.payout_addr&&!w.paid);
  if(!unclaimed.length){
    html+=`<div class="card"><p class="done-note">✓ ${u.allClaimed}</p></div>`;
    c.innerHTML=html; return;
  }

  // Profile (from account)
  html+=`<div class="card"><h2>${u.ivHdr}</h2><div class="sub">${u.ivIntro}</div>`;
  if(DATA.interviewDone) html+=`<div class="done-note">${u.ivDone}</div>`;
  html+=`<div class="prof"><span>${u.nick}: <b>${esc(DATA.nickname||'')}</b></span><span>${u.country}: <b>${esc(DATA.country||'')}</b></span></div>`;

  // Interview sections
  const iv=DATA.interview||{};
  const secs=['b','c','p','ph','x'];
  for(const s of secs){
    html+=`<div class="sec"><div class="sec-t">${SEC[s][lang]}</div>`;
    for(const q of Q.filter(x=>x.sec===s)){
      const val=iv[q.id]!=null?esc(iv[q.id]):'';
      const reqStar=q.req?'<span class="req">*</span>':'';
      let field;
      if(q.t==='area') field=`<textarea id="iv_${q.id}">${val}</textarea>`;
      else if(q.t==='num') field=`<input id="iv_${q.id}" type="number" min="1" max="120" value="${val}">`;
      else if(q.t==='gender'){ const g=GENDER[lang]; field=`<select id="iv_${q.id}"><option value="">—</option>${g.map((o,i)=>`<option value="${['male','female','other'][i]}"${iv[q.id]===['male','female','other'][i]?' selected':''}>${o}</option>`).join('')}</select>`; }
      else field=`<input id="iv_${q.id}" type="text" value="${val}">`;
      html+=`<div class="q" data-qid="${q.id}" data-req="${q.req}"><label>${q.L[lang]}${reqStar}</label>${field}</div>`;
    }
    html+=`</div>`;
  }
  html+=`</div>`;

  // Wallet + submit
  html+=`<div class="card"><h2>${u.walletHdr}</h2>`;
  html+=`<div class="q" style="margin-top:12px"><label>${u.walletLabel}<span class="req">*</span></label><input id="wallet" type="text" placeholder="T... (TRON / TRC20)" autocomplete="off" spellcheck="false"></div>`;
  html+=`<div class="wnote">${u.walletNote}</div>`;
  html+=`<button class="btn" id="submitBtn" onclick="submitClaim()">${u.submit}</button>`;
  html+=`<div class="msg" id="msg"></div></div>`;
  c.innerHTML=html;
}

function collectInterview(){
  const iv={}; let missing=null;
  for(const q of Q){
    const el=document.getElementById('iv_'+q.id); if(!el) continue;
    const v=(el.value||'').trim();
    iv[q.id]=v;
    const wrap=document.querySelector('.q[data-qid="'+q.id+'"]');
    if(q.req && !v){ if(wrap) wrap.classList.add('invalid'); if(!missing) missing=wrap; }
    else if(wrap) wrap.classList.remove('invalid');
  }
  return {iv,missing};
}

// Payout-wallet email verification (localized; only winners ever see this).
const OTP_T={
  otpLabel:{en:'Verification code',ko:'인증 코드',zh:'验证码',es:'Código de verificación',vi:'Mã xác minh',ru:'Код подтверждения'},
  otpSent:{en:'We emailed you a 6-digit code — enter it and submit again.',ko:'이메일로 6자리 코드를 보냈어요. 입력 후 다시 제출하세요.',zh:'已向您的邮箱发送6位验证码，请输入后再次提交。',es:'Te enviamos un código de 6 dígitos por correo. Introdúcelo y envía de nuevo.',vi:'Chúng tôi đã gửi mã 6 số qua email — nhập mã và gửi lại.',ru:'Мы отправили 6-значный код на почту — введите его и отправьте снова.'},
  otpEnter:{en:'Enter the code we emailed you.',ko:'이메일로 받은 코드를 입력하세요.',zh:'请输入邮箱收到的验证码。',es:'Introduce el código que te enviamos.',vi:'Nhập mã đã gửi qua email.',ru:'Введите код из письма.'},
  otpBad:{en:'That code is incorrect or expired.',ko:'코드가 올바르지 않거나 만료되었습니다.',zh:'验证码错误或已过期。',es:'El código es incorrecto o ha caducado.',vi:'Mã không đúng hoặc đã hết hạn.',ru:'Код неверен или истёк.'},
  otpFail:{en:'Could not send the code. Try again.',ko:'코드 발송에 실패했습니다. 다시 시도해주세요.',zh:'发送验证码失败，请重试。',es:'No se pudo enviar el código. Inténtalo de nuevo.',vi:'Không gửi được mã. Vui lòng thử lại.',ru:'Не удалось отправить код. Повторите.'}
};
function ot(k){ return (OTP_T[k]&&(OTP_T[k][lang]||OTP_T[k].en))||''; }
let otpRequested=false;
function showOtpField(){
  var wrap=document.getElementById('otpWrap');
  if(!wrap){
    var btn=document.getElementById('submitBtn');
    wrap=document.createElement('div'); wrap.id='otpWrap'; wrap.style.cssText='margin:0 0 14px;text-align:left';
    wrap.innerHTML='<label style="display:block;font-size:13px;color:var(--mut);margin-bottom:6px">'+ot('otpLabel')+'</label>'
      +'<input id="claimOtp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" style="width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--txt);font-size:16px;letter-spacing:6px;text-align:center;outline:none">';
    btn.parentNode.insertBefore(wrap,btn);
  }
  wrap.style.display='block';
  var f=document.getElementById('claimOtp'); if(f) f.focus();
}
async function submitClaim(){
  const u=U[lang], msg=document.getElementById('msg'), btn=document.getElementById('submitBtn');
  const {iv,missing}=collectInterview();
  if(missing){ msg.className='msg err'; msg.textContent=u.required; missing.scrollIntoView({behavior:'smooth',block:'center'}); return; }
  const wallet=(document.getElementById('wallet').value||'').trim();
  if(!TRC20.test(wallet)){ msg.className='msg err'; msg.textContent=u.badWallet; document.getElementById('wallet').focus(); return; }
  const unclaimed=(DATA.winnings||[]).filter(w=>!w.payout_addr&&!w.paid);
  if(!unclaimed.length) return;
  const otpEl=document.getElementById('claimOtp');
  const otpVal=(otpEl&&otpEl.value||'').trim();
  btn.disabled=true; msg.className='msg'; msg.style.display='block'; msg.style.color='var(--mut)'; msg.textContent=u.submitting;
  try{
    // Step 1 — request the email code once (single call, no wallet stored yet).
    if(!otpRequested){
      const r=await fetch(WORKER_URL+'/arena/claim-prize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionToken:token(),id:unclaimed[0].id,address:wallet,interview:iv})});
      const j=await r.json();
      if(j.error==='otp_sent'){ otpRequested=true; showOtpField(); msg.className='msg'; msg.style.color='var(--mut)'; msg.textContent=ot('otpSent'); btn.disabled=false; return; }
      if(j.error==='bad_trc20'){ msg.className='msg err'; msg.textContent=u.badWallet; btn.disabled=false; return; }
      if(j.error==='interview_required'){ msg.className='msg err'; msg.textContent=u.required; btn.disabled=false; return; }
      if(j.error==='otp_send_failed'){ msg.className='msg err'; msg.textContent=ot('otpFail'); btn.disabled=false; return; }
      msg.className='msg err'; msg.textContent=u.err; btn.disabled=false; return;
    }
    // Step 2 — verify the entered code and claim every unclaimed prize.
    if(!otpVal){ msg.className='msg err'; msg.textContent=ot('otpEnter'); btn.disabled=false; return; }
    let allOk=true, err='';
    for(const w of unclaimed){
      const r=await fetch(WORKER_URL+'/arena/claim-prize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionToken:token(),id:w.id,address:wallet,interview:iv,otp:otpVal})});
      const j=await r.json();
      if(!j.ok){ allOk=false; err=j.error||''; break; }
    }
    if(allOk){ msg.className='msg ok'; msg.textContent=u.ok; setTimeout(load,1400); }
    else if(err==='otp_bad'){ msg.className='msg err'; msg.textContent=ot('otpBad'); }
    else if(err==='bad_trc20'){ msg.className='msg err'; msg.textContent=u.badWallet; }
    else{ msg.className='msg err'; msg.textContent=u.err; }
  }catch(e){ msg.className='msg err'; msg.textContent=u.err; }
  btn.disabled=false;
}

applyChrome();
load();
</script>
</body>
