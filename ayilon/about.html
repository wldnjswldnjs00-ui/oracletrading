  .card p{color:var(--mut);font-size:14px;margin:0}
  .btn{display:inline-block;background:var(--accent);color:#06140e;font-weight:600;padding:13px 26px;border-radius:11px;margin-top:8px}
  .note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;color:var(--mut);font-size:13px;margin-top:30px}
  footer{border-top:1px solid var(--line);padding:26px 0;color:var(--dim);font-size:13px;text-align:center}
  footer a{color:var(--mut);margin:0 8px}
  @media(max-width:680px){.grid{grid-template-columns:1fr}}
